version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - npm install --no-save @parcel/watcher-linux-x64-glibc
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "No frontend build needed"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
